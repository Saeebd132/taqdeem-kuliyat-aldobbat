<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نموذج التقديم</title>
<style>
body{
font-family:Arial;
background:#0f2027;
color:white;
padding:20px;
}
form{
max-width:800px;
margin:auto;
background:#0b1320;
padding:30px;
border-radius:10px;
}
label{
display:block;
margin-top:15px;
font-weight:bold;
}
textarea{
width:100%;
height:80px;
margin-top:5px;
border-radius:5px;
padding:10px;
}
button{
margin-top:20px;
padding:15px;
width:100%;
background:#4f6cff;
border:none;
color:white;
font-size:18px;
border-radius:8px;
cursor:pointer;
}
</style>
</head>
<body>

<form>
<h2>نموذج تقديم كلية الضباط</h2>

<label>1- عرف عن نفسك</label><textarea></textarea>
<label>2- كيف توازن بين الطاعة العسكرية واتخاذ القرار الصحيح</label><textarea></textarea>
<label>3- وش الفرق بين القيادة والسيطرة</label><textarea></textarea>
<label>4- موقف فشلت فيه… وش تعلمت منه</label><textarea></textarea>
<label>5- كيف تتصرف لو كان فريقك رافض قرارك</label><textarea></textarea>
<label>6- وش معنى الأمانة في العمل العسكري</label><textarea></textarea>
<label>7- هل تشوف نفسك قائد؟ وليه</label><textarea></textarea>
<label>8- كيف تتعامل مع شخص يستفزك عمدًا</label><textarea></textarea>
<label>9- متى ترفض الأمر؟ ومتى تنفذه بدون نقاش</label><textarea></textarea>
<label>10- لو خُيّرت بين مصلحة زميلك وتطبيق النظام، وش تختار</label><textarea></textarea>
<label>11- سبب تقديمك لكلية الضباط</label><textarea></textarea>
<label>12- إذا شفت خويك يخالف الأنظمة وش تسوي</label><textarea></textarea>
<label>13- جاك أمر عسكري نظامي لكن يضر بالمصلحة العامة وش تسوي</label><textarea></textarea>
<label>14- عطني تكتيك عسكري</label><textarea></textarea>
<label>15- وش معنى الانضباط العسكري</label><textarea></textarea>
<label>16- إذا جاك أمر يخالف الأنظمة وش تسوي</label><textarea></textarea>
<label>17- سبب تقديمك لكلية الضباط</label><textarea></textarea>
<label>18- وش تعرف عن كلية الضباط</label><textarea></textarea>
<label>19- وش معنى شرف الخدمة</label><textarea></textarea>

<button>إرسال الطلب</button>
</form>

</body>
</html>
