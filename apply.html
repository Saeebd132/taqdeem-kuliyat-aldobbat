<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نموذج تقديم كلية الضباط</title>

<style>
body{
margin:0;
font-family:Arial;

/* الخلفية */
background:
linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
url("bg.jpg") no-repeat center center fixed;

background-size:cover;
color:white;
padding:30px;
}

/* صندوق النموذج */
form{
max-width:850px;
margin:auto;
background:rgba(11,19,32,0.95);
padding:30px;
border-radius:15px;
}

/* الشعار */
.logo{
text-align:center;
margin-bottom:20px;
}
.logo img{
width:120px;
}

/* العناوين */
label{
display:block;
margin-top:15px;
font-weight:bold;
}

/* الخانات */
input, textarea{
width:100%;
margin-top:5px;
border-radius:6px;
padding:10px;
border:none;
font-size:14px;
}
textarea{
height:80px;
}

/* زر الإرسال */
button{
margin-top:25px;
padding:15px;
width:100%;
background:#4f6cff;
border:none;
color:white;
font-size:18px;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<form>

<div class="logo">
<img src="logo.png" alt="الشعار">
<h2>نموذج تقديم كلية الضباط</h2>
</div>

<label>1- يوزرك في ديسكورد</label>
<input placeholder="مثال: User#1234">

<label>2- عرف عن نفسك</label><textarea></textarea>
<label>3- كيف توازن بين الطاعة العسكرية واتخاذ القرار الصحيح</label><textarea></textarea>
<label>4- وش الفرق بين القيادة والسيطرة</label><textarea></textarea>
<label>5- موقف فشلت فيه… وش تعلمت منه</label><textarea></textarea>
<label>6- كيف تتصرف لو كان فريقك رافض قرارك</label><textarea></textarea>
<label>7- وش معنى الأمانة في العمل العسكري</label><textarea></textarea>
<label>8- هل تشوف نفسك قائد؟ وليه</label><textarea></textarea>
<label>9- كيف تتعامل مع شخص يستفزك عمدًا</label><textarea></textarea>
<label>10- متى ترفض الأمر؟ ومتى تنفذه بدون نقاش</label><textarea></textarea>
<label>11- لو خُيّرت بين مصلحة زميلك وتطبيق النظام، وش تختار</label><textarea></textarea>
<label>12- سبب تقديمك لكلية الضباط</label><textarea></textarea>
<label>13- إذا شفت خويك يخالف الأنظمة وش تسوي</label><textarea></textarea>
<label>14- جاك أمر عسكري نظامي لكن يضر بالمصلحة العامة وش تسوي</label><textarea></textarea>
<label>15- عطني تكتيك عسكري</label><textarea></textarea>
<label>16- وش معنى الانضباط العسكري</label><textarea></textarea>
<label>17- إذا جاك أمر يخالف الأنظمة وش تسوي</label><textarea></textarea>
<label>18- وش تعرف عن كلية الضباط</label><textarea></textarea>
<label>19- وش معنى شرف الخدمة</label><textarea></textarea>

<button>إرسال الطلب</button>

</form>

</body>
</html>
