<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم</title>
<style>
body{
font-family:Arial;
background:#0f2027;
color:white;
padding:20px;
}
.card{
background:#0b1320;
padding:20px;
border-radius:10px;
margin-bottom:15px;
}
button{
margin:5px;
padding:8px 15px;
border:none;
border-radius:5px;
cursor:pointer;
}
.accept{background:green;color:white;}
.reject{background:red;color:white;}
</style>
</head>
<body>

<h1>لوحة تحكم المسؤولين</h1>

<div class="card">
<h3>طلب جديد</h3>
<p>اسم المتقدم: —</p>
<button class="accept">قبول</button>
<button class="reject">رفض</button>
</div>

</body>
</html>
